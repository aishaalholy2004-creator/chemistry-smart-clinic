function allowed(k){let i=stages.findIndex(x=>x[0]===k);return i<=0||stages.slice(0,i).every(x=>done(x[0]))&&(k!=='cert'||done('cert'))}
function journey(){return `<div class="journey">${stages.map(([k,t,d,g,c],i)=>`<button class="step" style="background:${c}" ${!allowed(k)?'disabled':''} onclick="route('${k}')"><span>${String(i+1).padStart(2,'0')} · ${done(k)?'✓ مكتمل':!allowed(k)?'مغلق':'متاح'}</span><span class="glyph">${g}</span><strong>${t}</strong><small>${d}</small></button>`).join('')}</div>`}

function pathPage(){paint(heading('رحلتك نحو الإتقان','أكملي كل محطة لفتح المحطة التالية')+panel(`<label>الوحدة الدراسية</label><select onchange="changeUnit(this.value)">${opts()}</select><p>${stages.filter(x=>done(x[0])).length} من 7 محطات مكتملة</p><div class="meter"><div style="width:${stages.filter(x=>done(x[0])).length/7*100}%"></div></div>`)+journey())}
function finishStage(k){if(k==='activities'||k==='games'){if([...document.querySelectorAll('.quiz-question .answer')].some(b=>!b.disabled))return toast('أكملي جميع الأسئلة أولًا');if(k==='games'&&document.querySelector('.match-choice:not(:disabled)'))return toast('أكملي جميع المطابقات أولًا')}if(!document.getElementById('stage-confirm')?.checked)return toast('أكدي إكمال المحطة أولًا');try{localStorage.setItem(progressKey(),JSON.stringify({...progress(),[k]:true}));route('path')}catch(e){fail(e)}}
function stageEnd(k){return `<div class="panel no-print"><label class="stagecheck"><input type="checkbox" id="stage-confirm">أكملت هذه المحطة</label>${btn('إنهاء المحطة وفتح التالية',`finishStage('${k}')`)} ${btn('العودة للمسار',"route('path')")}</div>`}
function register(next){paint(heading('فتح ملف الطالبة','تُحفظ نتائجك على حساب هذا المتصفح فقط')+panel(`<form onsubmit="window.registerStudent(event,'${next}')"><label>الاسم الثلاثي</label><input id="stname" required maxlength="100" minlength="2" placeholder="اسم الطالبة"><label>الشعبة</label><input id="stsection" required maxlength="50" placeholder="ثالث / 1">${btn('بدء الرحلة')}</form><div class="notice">مهم: الدخول المجهول لا يتيح استعادة النتائج بعد حذف بيانات المتصفح أو تغيير الجهاز. لا تستخدمي جهازًا مشتركًا.</div>`))}
async function registerStudent(ev,next){ev.preventDefault();try{let name=$('#stname').value.trim(),section=$('#stsection').value.trim();if(name.length<2||!section)return toast('اكتبي الاسم والشعبة');let user=auth.currentUser;if(!user){const c=await signInAnonymously(auth);user=c.user}if(user.uid===teacherUid)return toast('حساب المعلمة مخصص للإدارة');const p={name,section,createdAt:new Date().toISOString()};let ref=doc(db,'students',user.uid),existing=await getDoc(ref);if(existing.exists())await updateDoc(ref,{name,section});else await setDoc(ref,p);S.user=user;S.profile=p;$('#who').textContent=name;await refreshResult();route(next)}catch(e){fail(e)}}
function intro(kind){let pre=S.result.pre?.score,post=S.result.post?.score;paint(heading(kind==='pre'?'الاستقبال والتشخيص':'فحص الإتقان','10 أسئلة، درجة من 10')+panel(`<span class="chip">الوحدة: ${E(thisUnit()?.title)}</span><select aria-label="اختيار الوحدة" onchange="changeUnit(this.value)">${opts()}</select><div class="report-grid"><div class="panel">الاختبار القبلي<strong>${pre??'—'}/10</strong></div><div class="panel">الاختبار البعدي<strong>${post??'—'}/10</strong></div><div class="panel">التحسن<strong>${pre!=null&&post!=null?(post-pre)*10+' نقطة مئوية':'—'}</strong></div><div class="panel">حد الإتقان<strong>${S.mastery}%</strong></div></div>${kind==='post'&&pre==null?'<div class="notice err">أنجزي الاختبار القبلي أولًا.</div>':''}${btn(kind==='pre'?'ابدئي الاختبار القبلي':'ابدئي الاختبار البعدي',`startQuiz('${kind}')`)}</div>`))}
function startQuiz(kind){if(kind==='post'&&!allowed('post'))return toast('ابدئي بالاختبار القبلي');const q=questions(kind).slice(0,10);if(q.length!==10)return toast('هذه الوحدة تحتاج 10 أسئلة لهذا الاختبار');S.quiz={kind,items:q};S.answers={};renderQuiz()}
const cheersGood=['أحسنتِ! فهم ممتاز للمفهوم.','رائع! إجابة دقيقة.','ممتاز، تقدّم واضح!','اختيار موفق، واصلي!','إتقان جميل، استمري!'];

function questionCard(q,i,practice=false){return `<section class="quiz-question" id="question-${E(q.id)}"><span class="chip">${practice?'تدريب '+(i+1)+' · المستوى '+E(q.level):'السؤال '+(i+1)+' من 10'}</span><h3>${E(q.prompt)}</h3><div class="answer-grid">${q.options.map((o,j)=>`<button type="button" class="answer" onclick="${practice?'practiceAnswer':'pick'}('${E(q.id)}',${j},this)"><span class="answer-letter">${'أبجد'[j]||j+1}</span>${E(o)}</button>`).join('')}</div><div class="feedback" id="feedback-${E(q.id)}" role="status" hidden></div></section>`}
function renderQuiz(){paint(heading(S.quiz.kind==='pre'?'الاختبار القبلي':'الاختبار البعدي','اختاري إجابة واحدة لكل سؤال؛ تظهر التغذية الراجعة فورًا')+`<div class="quiz-progress"><b id="quiz-count">تمت الإجابة عن 0 من 10</b><div class="meter"><div id="quiz-fill" style="width:0%"></div></div></div>`+S.quiz.items.map((q,i)=>questionCard(q,i)).join('')+btn('تسليم وحفظ النتيجة','submitQuiz()'))}
function showFeedback(q,index,element,ordinal){const card=element.closest('.quiz-question');const buttons=[...card.querySelectorAll('.answer')];const correct=index===q.answer;buttons.forEach((b,j)=>{b.disabled=true;b.classList.toggle('correct',j===q.answer);b.classList.toggle('incorrect',j===index&&!correct);b.setAttribute('aria-pressed',String(j===index))});const f=card.querySelector('.feedback');const phrases=correct?cheersGood:cheersBad;f.className='feedback '+(correct?'good':'bad');f.innerHTML=`<strong>${correct?'✓ إجابة صحيحة':'✕ إجابة غير صحيحة'} — ${phrases[ordinal%phrases.length]}</strong>${correct?'':`<div>الإجابة الصحيحة: ${E(q.options[q.answer])}</div>`}<div>${E(q.explanation||'')}</div>`;f.hidden=false;}
function pick(id,index,element){if(Object.prototype.hasOwnProperty.call(S.answers,id))return;const q=S.quiz.items.find(x=>x.id===id);if(!q)return;S.answers[id]=index;showFeedback(q,index,element,Object.keys(S.answers).length-1);const n=Object.keys(S.answers).length;$('#quiz-count').textContent=`تمت الإجابة عن ${n} من 10`;$('#quiz-fill').style.width=n*10+'%';}
async function submitQuiz(){if(Object.keys(S.answers).length!==10)return toast('جاوبي عن الأسئلة العشرة');let kind=S.quiz.kind,correct=S.quiz.items.filter(q=>S.answers[q.id]===q.answer),score=correct.length,weak=[...new Set(S.quiz.items.filter(q=>S.answers[q.id]!==q.answer).map(q=>q.skillId))];let result={score,weak,at:new Date().toISOString(),skills:Object.fromEntries(skills().map(s=>[s.id,{correct:S.quiz.items.filter(q=>q.skillId===s.id&&S.answers[q.id]===q.answer).length,total:S.quiz.items.filter(q=>q.skillId===s.id).length}]))};try{const newResult={pre:S.result.pre||{},post:kind==='pre'?{}:S.result.post||{},[kind]:result,updatedAt:new Date().toISOString()};await setDoc(doc(db,'results',S.user.uid,'units',S.unitId),newResult);S.result=newResult;paint(heading('تم حفظ نتيجتك في Firebase')+panel(`<div style="text-align:center"><h1 style="font-size:55px">${score}/10</h1><p>${kind==='pre'?'تم تحديد المهارات التي تحتاج دعمًا':score*10>=S.mastery?'تهانينا، حققتِ درجة الإتقان':'تحتاجين جولة تدريب أخرى'}</p><div class="chip">${kind==='post'?'نسبة التحسن: '+(score-(S.result.pre?.score||0))*10+' نقطة مئوية':'التشخيص مكتمل'}</div><div class="btn-row">${btn('متابعة المسار',"route('path')")}${kind==='post'&&score*10>=S.mastery?btn('شهادتي',"route('cert')"):''}</div></div>`))}catch(e){fail(e)}}
function targetSkills(){const w=S.result.pre?.weak||[];return skills().filter(x=>!w.length||w.includes(x.id))}
function pharmacy(){if(S.result.pre?.score==null)return paint(heading('صيدلية المفاهيم')+panel('أكملي التشخيص أولًا '+btn('الاختبار القبلي',"route('pre')")));let weak=S.result.pre.weak||[];paint(heading('صيدلية المفاهيم','وصفة تعليمية مبنية على نتيجة التشخيص')+panel(`<span class="chip">${E(thisUnit()?.title)}</span><h3>${weak.length?'المهارات التي تحتاج تقوية':'أحسنتِ! جميع المهارات متقنة في التشخيص'}</h3><p>${targetSkills().map(x=>E(x.title)).join(' • ')}</p>`)+targetSkills().map(x=>panel(`<span class="chip">${weak.length?'مهارة تحتاج دعمًا':'مراجعة إثرائية'}</span><h2>${E(x.title)}</h2><h4>شرح المهارة</h4><p>${E(x.explanation)}</p><h4>مثال محلول</h4><p>${E(x.example)}</p><h4>خريطة المفاهيم</h4><div class="concept-map"><b>${E(x.title)}</b><span>↓</span><div>${String(x.map||x.explanation).split(/←|→|\/|\|/).map(t=>`<span>${E(t.trim())}</span>`).join('')}</div></div>`)).join('')+stageEnd('pharmacy'))}

function therapy(){if(S.result.pre?.score==null)return pharmacy();const treatmentSkills=[...targetSkills(),...skills().filter(x=>!targetSkills().some(y=>y.id===x.id))];const ids=treatmentSkills.map(x=>x.id);const qs=questions('practice').filter(q=>ids.includes(q.skillId));let body='';if(treatmentTab==='activities'){body=treatmentSkills.map(x=>panel(`<h2>${E(x.title)}</h2><p>${qs.filter(q=>q.skillId===x.id).length} تدريبات مستقلة لهذه المهارة</p>`)+qs.filter(q=>q.skillId===x.id).map((q,i)=>questionCard(q,i,true)).join('')).join('')}else if(treatmentTab==='games'){body=treatmentSkills.map(matchGame).join('')}else{body=panel(`<h2>ورقة عمل • ${E(thisUnit()?.title)}</h2><p>الاسم: ....................... التاريخ: .......................</p>${treatmentSkills.map(x=>`<h3>${E(x.title)} • ${worksheetItems(x).length} أسئلة</h3>${worksheetItems(x).map((p,i)=>`<p>${i+1}. ${E(p[0])}</p><textarea aria-label="إجابة ${E(x.title)} ${i+1}"></textarea>`).join('')}`).join('')}<details><summary>نموذج الإجابة للمراجعة الذاتية</summary>${treatmentSkills.map(x=>`<h3>${E(x.title)}</h3>${worksheetItems(x).map((p,i)=>`<p>${i+1}. ${E(p[1])}</p>`).join('')}`).join('')}</details><button class="btn gold no-print" onclick="window.print()">طباعة ورقة العمل</button>`)}paint(heading(stages.find(x=>x[0]===treatmentTab)[1],'غرفة العلاج • محطة مستقلة')+body+stageEnd(treatmentTab))}
window.switchTreatment=function(t){treatmentTab=t;therapy()};
function practiceAnswer(id,j,element){const qs=questions('practice');const q=qs.find(x=>x.id===id);if(!q||element.disabled)return;showFeedback(q,j,element,qs.indexOf(q));}
function certificate(){
 const p=S.result.post;
 const good=!!p && p.score*10>=S.mastery;
 const mastered=good?skills().filter(s=>{const t=p.skills?.[s.id];return t&&t.total>0&&t.correct/t.total>=S.mastery/100;}):[];
 const body=good?`<div class="certificate"><div class="seal">♛</div><h1>شهادة إتقان</h1><p>تُمنح للطالبة</p><h2>${E(S.profile?.name||'')}</h2><p>لتحقيق درجة الإتقان في برنامج عيادة الكيمياء الذكية</p><h3>${E(thisUnit()?.title||'')}</h3><p>المهارات المتقنة: ${E(mastered.map(s=>s.title).join('، ')||'إتقان الوحدة')}</p><p>النتيجة: ${p.score}/10</p><p>ثانوية هروب – تعليم جازان</p><b>إعداد وتنفيذ المعلمة / غادة الأمير</b></div><div class="no-print">${btn('طباعة أو حفظ PDF','window.print()')}</div>`:panel(`<p>الشهادة تظهر بعد تحقيق ${S.mastery}% على الأقل في الاختبار البعدي.</p>${btn('العودة للتدريبات',"route('therapy')")}`);
 paint(heading('شهادة الإتقان')+body);
}
function adminLogin(){paint(heading('دخول المعلمة','لوحة محمية بحساب المعلمة في Firebase Authentication')+panel(`<form onsubmit="teacherLogin(event)"><label>البريد الإلكتروني</label><input id="mail" type="email" autocomplete="username" required><label>كلمة المرور</label><input id="pwd" type="password" autocomplete="current-password" required><button class="btn gold">تسجيل الدخول</button></form>`))}
async function teacherLogin(event){event.preventDefault();try{let email=$('#mail').value,password=$('#pwd').value;const c=await signInWithEmailAndPassword(auth,email,password);if(c.user.uid!==teacherUid){await signOut(auth);throw Error('هذا الحساب غير مصرح له بدخول لوحة المعلمة')}toast('تم تسجيل الدخول');S.route='admin'}catch(e){fail(e)}}
async function admin(){if(!S.teacher)return adminLogin();paint(heading('لوحة قياس الأثر','ثانوية هروب • المعلمة غادة الأمير')+panel('جارٍ تحميل النتائج من قاعدة البيانات…'));try{let st=await getDocs(collection(db,'students'));let all=[];for(let d of st.docs){let rs=await getDocs(collection(db,'results',d.id,'units'));if(rs.empty){all.push({uid:d.id,...d.data(),unitId:'',pre:null,post:null})}else rs.forEach(r=>{const z=r.data();all.push({uid:d.id,...d.data(),unitId:r.id,pre:z.pre?.score??null,post:z.post?.score??null,preSkills:z.pre?.skills||{},postSkills:z.post?.skills||{}})})}S.adminData=all;drawAdmin()}catch(e){fail(e)}}
function averages(rows,key){let arr=rows.map(x=>x[key]).filter(x=>x!==null);return arr.length?(arr.reduce((a,b)=>a+b,0)/arr.length).toFixed(1):'—'}
function drawAdmin(){let rows=S.adminData,paired=rows.filter(x=>x.pre!==null&&x.post!==null),avgpre=averages(rows,'pre'),avgpost=averages(rows,'post');let mastered=paired.filter(x=>x.post*10>=S.mastery);let gain=paired.length?(paired.reduce((sum,x)=>sum+x.post-x.pre,0)/paired.length*10).toFixed(1):'—';const byskill={};paired.forEach(x=>Object.entries(x.preSkills).forEach(([id,rec])=>{let z=byskill[id]||(byskill[id]={pre:0,post:0,total:0});let post=x.postSkills[id];if(rec.total&&post?.total){z.pre+=rec.correct/rec.total;z.post+=post.correct/post.total;z.total++}}));let skillsReport=Object.entries(byskill).map(([id,v])=>({name:S.content.skills.find(s=>s.id===id)?.title||id,pre:Math.round(v.pre/v.total*100),post:Math.round(v.post/v.total*100)}));paint(heading('لوحة المعلمة','النتائج الحقيقية المحفوظة في Firestore')+`<div class="admin-actions no-print">${btn('تحديث النتائج','admin()')}${btn('تصدير Excel / CSV','exportCSV()')}${btn('طباعة تقرير PDF','printReport()')}${btn('إدارة الأسئلة والوحدات','contentEditor()')}${btn('إعدادات الإتقان','settingsEditor()')}<button class="btn outline" onclick="teacherLogout()">تسجيل الخروج</button></div><div id="print-area"><div class="report-grid"><div class="panel">عدد سجلات الطالبات<strong>${new Set(rows.map(x=>x.uid)).size}</strong></div><div class="panel">متوسط القبلي / 10<strong>${avgpre}</strong></div><div class="panel">متوسط البعدي / 10<strong>${avgpost}</strong></div><div class="panel">متوسط التحسن<strong>${gain==='—'?'—':gain+'%'}</strong></div><div class="panel">نسبة الإتقان (للمكتملات)<strong>${paired.length?Math.round(mastered.length/paired.length*100)+'%':'—'}</strong></div></div>${heading('مقارنة متوسط الدرجات')}<div class="panel"><div>قبلي: ${avgpre}/10</div><div class="meter"><div style="width:${Number(avgpre||0)*10}%"></div></div><div>بعدي: ${avgpost}/10</div><div class="meter"><div style="width:${Number(avgpost||0)*10}%"></div></div></div>${heading('أداء المهارات')}<div class="panel">${skillsReport.length?skillsReport.map(s=>`<div style="margin:15px 0"><b>${E(s.name)}</b> · ${s.pre}% ← ${s.post}%<div class="meter"><div style="width:${s.post}%"></div></div></div>`).join(''):'لا توجد اختبارات مكتملة للمقارنة بعد.'}</div>${heading('نتائج الطالبات')}<div class="panel admin-table"><table><thead><tr><th>الطالبة</th><th>الشعبة</th><th>الوحدة</th><th>قبلي</th><th>بعدي</th><th>التحسن</th><th>الحالة</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${E(x.name)}</td><td>${E(x.section)}</td><td>${E(units().find(u=>u.id===x.unitId)?.title||'—')}</td><td>${x.pre??'—'}</td><td>${x.post??'—'}</td><td>${x.pre!==null&&x.post!==null?(x.post-x.pre)*10+'%':'—'}</td><td>${x.post===null?'غير مكتمل':x.post*10>=S.mastery?'متقنة':'تحتاج علاجًا'}</td></tr>`).join('')}</tbody></table></div><p class="notice">التحسن محسوب كنقاط مئوية بين الدرجتين. عينات صغيرة أو اختبارات غير متكافئة لا تثبت أثر البرنامج وحدها.</p></div>`)}
function exportCSV(){let header=['الطالبة','الشعبة','الوحدة','القبلي','البعدي','التحسن بالنقاط المئوية','الإتقان'];let rows=S.adminData.map(x=>[x.name,x.section,units().find(u=>u.id===x.unitId)?.title||'',x.pre??'',x.post??'',x.pre!==null&&x.post!==null?(x.post-x.pre)*10:'',x.post!==null&&x.post*10>=S.mastery?'نعم':'لا']);let csv='\ufeff'+[header,...rows].map(a=>a.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='تقرير-قياس-الأثر.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function printReport(){window.print()}
function settingsEditor(){paint(heading('إعدادات البرنامج')+panel(`<label>درجة الإتقان (النسبة المئوية)</label><input id="mastery" type="number" min="1" max="100" value="${S.mastery}">${btn('حفظ الإعدادات','saveSettings()')}`))}
async function saveSettings(){let n=Number($('#mastery').value);if(n<1||n>100)return toast('اختاري رقمًا من 1 إلى 100');try{await setDoc(doc(db,'settings','clinic'),{mastery:n});S.mastery=n;toast('حُفظت الإعدادات');admin()}catch(e){fail(e)}}
function contentEditor(){paint(heading('إدارة محتوى البرنامج','تغييراتك تُحفظ في Firestore وتظهر لكل الطالبات')+panel(`<label>الوحدات الحالية</label><select id="editunit">${units().map(u=>`<option value="${E(u.id)}">${E(u.title)}</option>`).join('')}</select>${btn('إضافة وحدة','addUnit()')}<div class="admin-actions">${btn('إضافة مهارة','addSkill()')}${btn('إضافة سؤال','addQuestion()')}${btn('تعديل الأسئلة الحالية','editQuestionList()')}${btn('تعديل الشروحات','editSkillList()')}</div><p class="notice">لضمان دقة القياس، أضيفي 10 أسئلة قبلية و10 أسئلة بعدية مستقلة ومتكافئة لكل وحدة، وراجعي إجاباتها قبل نشر الاختبار.</p>`))}
async function persistContent(){await setDoc(doc(db,'content','catalog'),S.content);toast('تم حفظ المحتوى في Firebase')}
async function addUnit(){let title=prompt('اسم الوحدة الجديدة:')?.trim();if(!title)return;S.content.units.push({id:'u'+Date.now(),title});try{await persistContent();contentEditor()}catch(e){fail(e)}}
async function addSkill(){let id=$('#editunit').value,title=prompt('اسم المهارة:')?.trim();if(!title)return;let explanation=prompt('شرح مبسط للمهارة:')||'',example=prompt('مثال محلول:')||'',map=prompt('خريطة مفاهيم مختصرة:')||'';S.content.skills.push({id:'s'+Date.now(),unitId:id,title,explanation,example,map});try{await persistContent();contentEditor()}catch(e){fail(e)}}
async function addQuestion(){let unitId=$('#editunit').value,sk=S.content.skills.filter(s=>s.unitId===unitId);if(!sk.length)return toast('أضيفي مهارة للوحدة أولًا');paint(heading('إضافة سؤال جديد')+panel(`<form onsubmit="saveNewQuestion(event)"><label>المهارة</label><select id="qskill">${sk.map(s=>`<option value="${E(s.id)}">${E(s.title)}</option>`).join('')}</select><label>نوع السؤال</label><select id="qkind"><option value="pre">قبلي</option><option value="post">بعدي</option><option value="practice">تدريب</option></select><label>السؤال</label><textarea id="qprompt" required></textarea>${[0,1,2,3].map(i=>`<label>الخيار ${i+1}</label><input id="option${i}" required>`).join('')}<label>رقم الإجابة الصحيحة</label><select id="qanswer"><option value="0">الأول</option><option value="1">الثاني</option><option value="2">الثالث</option><option value="3">الرابع</option></select><label>تفسير الإجابة</label><textarea id="qexplain"></textarea><label>المستوى</label><select id="qlevel"><option>1</option><option>2</option><option>3</option></select><button class="btn gold">حفظ السؤال</button></form>`));S.newQuestionUnit=unitId}
async function saveNewQuestion(e){e.preventDefault();let q={id:'q'+Date.now(),unitId:S.newQuestionUnit,skillId:$('#qskill').value,kind:$('#qkind').value,level:Number($('#qlevel').value),prompt:$('#qprompt').value.trim(),options:[0,1,2,3].map(i=>$('#option'+i).value.trim()),answer:Number($('#qanswer').value),explanation:$('#qexplain').value.trim()};S.content.questions.push(q);try{await persistContent();contentEditor()}catch(e){S.content.questions.pop();fail(e)}}
function editQuestionList(){let unitId=$('#editunit').value;paint(heading('تعديل أسئلة الوحدة')+panel(`<button class="btn light" onclick="contentEditor()">عودة</button>`+S.content.questions.filter(q=>q.unitId===unitId).map(q=>`<div class="quiz-question"><b>${E(q.kind)} · ${E(q.prompt)}</b><div class="admin-actions"><button class="btn light" onclick="editExistingQuestion('${E(q.id)}')">تعديل</button><button class="btn light" onclick="removeQuestion('${E(q.id)}')">حذف</button></div></div>`).join('')))}
async function editExistingQuestion(id){let q=S.content.questions.find(x=>x.id===id);let p=prompt('نص السؤال:',q.prompt);if(p===null||!p.trim())return;let opts=[];for(let i=0;i<4;i++){let a=prompt('الخيار '+(i+1),q.options[i]);if(a===null)return;opts.push(a)}let answer=Number(prompt('ترتيب الإجابة الصحيحة (1–4)',q.answer+1))-1;if(answer<0||answer>3)return toast('الرقم غير صحيح');Object.assign(q,{prompt:p,options:opts,answer});try{await persistContent();contentEditor()}catch(e){fail(e)}}
async function removeQuestion(id){if(!confirm('حذف هذا السؤال؟'))return;S.content.questions=S.content.questions.filter(q=>q.id!==id);try{await persistContent();contentEditor()}catch(e){fail(e)}}
function editSkillList(){let unitId=$('#editunit').value;paint(heading('الشروحات والمهارات')+panel(S.content.skills.filter(x=>x.unitId===unitId).map(s=>`<div class="quiz-question"><h3>${E(s.title)}</h3>${btn('تعديل المهارة',`editExistingSkill('${E(s.id)}')`)}</div>`).join('')+btn('عودة','contentEditor()')))}
async function editExistingSkill(id){let s=S.content.skills.find(x=>x.id===id);for(let [k,label] of [['title','عنوان المهارة'],['explanation','الشرح'],['example','المثال'],['map','خريطة المفاهيم'],['video','رابط فيديو اختياري']]){let v=prompt(label,s[k]||'');if(v===null)return;s[k]=v}try{await persistContent();contentEditor()}catch(e){fail(e)}}
async function teacherLogout(){await signOut(auth);S.route='home';route('home')}
function route(page){S.route=page;document.body.classList.remove('menu');document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.route===page));$('#breadcrumb').textContent='البرنامج العلاجي / '+page;if(!S.ready)return;if(page==='home')return home();if(page==='admin')return admin();if(S.teacher)return paint(panel('هذه بوابة الطالبات. استخدمي لوحة المعلمة للإدارة.'));if(!S.profile)return register(page);if(page==='path'||page==='therapy')return pathPage();if(!allowed(page))return pathPage();if(['activities','games','worksheets'].includes(page)){treatmentTab=page;return therapy()}if(page==='pre'||page==='post')return intro(page);if(page==='pharmacy')return pharmacy();if(page==='therapy')return therapy();if(page==='cert')return certificate()}
Object.assign(window,{finishStage,route,changeUnit,registerStudent,pick,submitQuiz,startQuiz,practiceAnswer,teacherLogin,teacherLogout,admin,exportCSV,printReport,contentEditor,addUnit,addSkill,addQuestion,saveNewQuestion,editQuestionList,editExistingQuestion,removeQuestion,editSkillList,editExistingSkill,settingsEditor,saveSettings});
</script></body></html>
